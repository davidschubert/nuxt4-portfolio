<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Schematische Darstellung eines Analytics-Dashboards mit Diagrammen und Kennzahlen">
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="area1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0f172a"/>

  <!-- Topbar -->
  <rect x="0" y="0" width="1280" height="72" fill="#111c33"/>
  <rect x="48" y="28" width="140" height="16" rx="8" fill="url(#b1)"/>
  <rect x="1080" y="24" width="152" height="24" rx="12" fill="#1e293b"/>
  <circle cx="1044" cy="36" r="14" fill="#334155"/>

  <!-- KPI-Reihe -->
  <g>
    <rect x="48" y="104" width="280" height="120" rx="14" fill="#16213b"/>
    <rect x="72" y="128" width="90" height="10" rx="5" fill="#475569"/>
    <rect x="72" y="152" width="150" height="24" rx="6" fill="#f8fafc"/>
    <rect x="72" y="190" width="70" height="14" rx="7" fill="#065f46"/>
    <rect x="360" y="104" width="280" height="120" rx="14" fill="#16213b"/>
    <rect x="384" y="128" width="90" height="10" rx="5" fill="#475569"/>
    <rect x="384" y="152" width="120" height="24" rx="6" fill="#f8fafc"/>
    <rect x="384" y="190" width="70" height="14" rx="7" fill="#1e3a8a"/>
    <rect x="672" y="104" width="280" height="120" rx="14" fill="#16213b"/>
    <rect x="696" y="128" width="90" height="10" rx="5" fill="#475569"/>
    <rect x="696" y="152" width="135" height="24" rx="6" fill="#f8fafc"/>
    <rect x="696" y="190" width="70" height="14" rx="7" fill="#065f46"/>
    <rect x="984" y="104" width="248" height="120" rx="14" fill="url(#b1)"/>
    <rect x="1008" y="128" width="90" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
    <rect x="1008" y="152" width="140" height="24" rx="6" fill="#ffffff"/>
  </g>

  <!-- Großes Chart -->
  <g>
    <rect x="48" y="256" width="784" height="320" rx="14" fill="#16213b"/>
    <rect x="72" y="280" width="160" height="12" rx="6" fill="#475569"/>
    <g stroke="#1e293b" stroke-width="1.5">
      <line x1="72" y1="350" x2="808" y2="350"/>
      <line x1="72" y1="410" x2="808" y2="410"/>
      <line x1="72" y1="470" x2="808" y2="470"/>
      <line x1="72" y1="530" x2="808" y2="530"/>
    </g>
    <path d="M72 520 L180 470 L280 495 L380 420 L480 445 L580 360 L680 385 L808 310 L808 552 L72 552 Z" fill="url(#area1)"/>
    <path d="M72 520 L180 470 L280 495 L380 420 L480 445 L580 360 L680 385 L808 310" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M72 540 L180 510 L280 520 L380 480 L480 490 L580 430 L680 440 L808 400" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 0"/>
  </g>

  <!-- Donut + Liste -->
  <g>
    <rect x="864" y="256" width="368" height="320" rx="14" fill="#16213b"/>
    <rect x="888" y="280" width="140" height="12" rx="6" fill="#475569"/>
    <circle cx="1048" cy="410" r="72" fill="none" stroke="#1e293b" stroke-width="26"/>
    <circle cx="1048" cy="410" r="72" fill="none" stroke="#10b981" stroke-width="26" stroke-dasharray="271 452" transform="rotate(-90 1048 410)" stroke-linecap="round"/>
    <circle cx="1048" cy="410" r="72" fill="none" stroke="#60a5fa" stroke-width="26" stroke-dasharray="90 452" stroke-dashoffset="-282" transform="rotate(-90 1048 410)" stroke-linecap="round"/>
    <rect x="920" y="516" width="12" height="12" rx="3" fill="#10b981"/>
    <rect x="944" y="518" width="80" height="9" rx="4" fill="#475569"/>
    <rect x="1060" y="516" width="12" height="12" rx="3" fill="#60a5fa"/>
    <rect x="1084" y="518" width="80" height="9" rx="4" fill="#475569"/>
  </g>

  <!-- Untere Zeile -->
  <g>
    <rect x="48" y="608" width="1184" height="72" rx="14" fill="#16213b"/>
    <circle cx="92" cy="644" r="16" fill="#065f46"/>
    <rect x="128" y="630" width="200" height="10" rx="5" fill="#64748b"/>
    <rect x="128" y="650" width="140" height="8" rx="4" fill="#334155"/>
    <rect x="1080" y="632" width="120" height="24" rx="12" fill="url(#b1)"/>
  </g>
</svg>
